    <main>
        <form>
            <fieldset>
                <legend>Dados pessoais</legend>
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                <br>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="mail@example.com" required>
                <br>

                <label for="">Número de filhos</label>
                <input type="number" id="filhos" min="0" max="1000">
                <br>

                <label>Data de Nascimento</label>
                <input type="date" id="nascimento" min="1990-01-01" max="2009-12-31">
                <br>

                <label for="sexo">Sexo:</label>
                <input type="radio" id="sexo" name="sexo" value="M">Masculino
                <input type="radio" id="sexo" name="sexo" value="F">Feminino
                <br>

                <label for="estado">Estado</label>
                <select name="estado" id="estado">
                    <option value="0">Selecione</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                </select>

            </fieldset>
            <fieldset>
                <legend>Área de interesse</legend>
               <label> <input type="checkbox" name="html" value="html">HTML </label>
               <label> <input type="checkbox" name="css" value="css">CSS </label>
               <label> <input type="checkbox" name="js" value="js">JavaScript </label>

            </fieldset>
            <fieldset>
                <legend>Mensagem</legend>
                <textarea style="resize: none;" name="msg" id="msg" cols="30" rows="10" maxlength="10"></textarea>
                <br>
                <textarea name="msg" id="msg" cols="30" rows="10" readonly>Texto super especial para você</textarea>
                <br>
                <label><input type="checkbox" checked>Li e Aceito.</label>
                <br>

                <input type="range" min="0" max="10" step="0.2"> <br>
                <input type="time"><br>
                <input type="color"><br>

                <select multiple>
                    <option>opcao 1</option>
                    <option>opcao 2</option>
                    <option>opcao 3</option>
                    <option>opcao 4</option>
                </select>
            </fieldset>
            <br>

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </form>
